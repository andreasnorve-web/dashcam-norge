server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
  add_header Feature-Policy "camera 'self'; microphone 'self'; geolocation 'self'" always;

  # Aldri cache HTML/manifest/SW — ellers sitter telefoner fast på gammel standalone-PWA.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
  }

  location = / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    try_files /index.html =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|svg|ico|woff2|wasm)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
