server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Kamera krever sikker kontekst; Railway gir HTTPS på domenet.
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
  add_header Feature-Policy "camera 'self'; microphone 'none'; geolocation 'self'" always;

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|svg|ico|woff2|wasm)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
