server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Kamera krever sikker kontekst; Railway gir HTTPS på domenet.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|svg|ico|webmanifest|wasm)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
