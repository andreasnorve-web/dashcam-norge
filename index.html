<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1118" />
    <!-- Aldri apple-mobile-web-app-capable: standalone ødelegger kamera. -->
    <meta name="apple-mobile-web-app-title" content="Dashcam" />
    <meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(), geolocation=(self)" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Mobil dashcam med veibaner, skilt, bensinpriser og varsler." />
    <title>Dashcam Norge</title>
    <script>
      // Kjør før React: fjern gammel service worker/cache som holder standalone-PWA i live.
      (function () {
        if (!('serviceWorker' in navigator)) return
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister() })
        })
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k) })
          })
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
